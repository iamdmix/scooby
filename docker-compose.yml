# ~/server/docker-compose.yml
x-common-keys: &common-keys
  restart: unless-stopped

services:
  # --- INFRASTRUCTURE ---
  portainer:
    <<: *common-keys
    image: portainer/portainer-ce:lts
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  pihole:
    <<: *common-keys
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: 'Asia/Kolkata'
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD:-your_secure_password}
      FTLCONF_LOCAL_IPV4: '127.0.0.1'
    volumes:
      - pihole_config:/etc/pihole
      - dnsmasq_config:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN

  # --- MONITORING & DASHBOARD ---
  # (uptime-kuma removed 2026-09-19)
  homepage:
    <<: *common-keys
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - HOMEPAGE_VAR_PIHOLE_KEY=${HOMEPAGE_VAR_PIHOLE_KEY}
      - HOMEPAGE_VAR_PORTAINER_API_KEY=${HOMEPAGE_VAR_PORTAINER_API_KEY}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${HOMEPAGE_VAR_JELLYFIN_API_KEY}
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- MEDIA & CONTENT ---
  jellyfin:
    <<: *common-keys
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${HOME}/Media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=${SERVER_URL:-http://localhost:8096}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # --- AUTOMATION ---
  # (n8n removed 2026-09-19)

  # --- DASHBOARD ASSETS (background images) ---
  assets:
    <<: *common-keys
    image: busybox:latest
    container_name: assets
    command: httpd -f -p 8080 -h /shared
    volumes:
      - ./config/images:/shared:ro
    ports:
      - "3300:8080"

  # --- LOGS & METRICS ---
  dozzle:
    <<: *common-keys
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  beszel:
    <<: *common-keys
    image: henrygd/beszel:latest
    container_name: beszel
    ports:
      - "8889:8090"
    volumes:
      - ./data/beszel-keys:/beszel_data:rw

  beszel-agent:
    <<: *common-keys
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host   # required for accurate host CPU/RAM metrics on macOS/Docker Desktop & OrbStack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/beszel-keys/id_ed25519.pub:/keys/id_ed25519.pub:ro
    environment:
      PORT: "7222"
      KEY_FILE: /keys/id_ed25519.pub

# --- LIBRARY / READING ---
  kavita:
    <<: *common-keys
    image: jvmilazz0/kavita:latest
    container_name: kavita
    ports:
      - "5001:5000"
    environment:
      TZ: 'Asia/Kolkata'
    volumes:
      - ./data/kavita/config:/kavita/config
      - ./data/kavita/manga:/manga
      - ./data/kavita/comics:/comics
      - ./data/kavita/books:/books

volumes:
  portainer_data:
  pihole_config:
  dnsmasq_config:
  jellyfin_config:
  jellyfin_cache:
