# ~/server/docker-compose.yml
x-common-keys: &common-keys
  restart: unless-stopped

services:
  # --- INFRASTRUCTURE ---
  portainer:
    <<: *common-keys
    image: portainer/portainer-ce:lts
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  pihole:
    <<: *common-keys
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: 'Asia/Kolkata'
      WEBPASSWORD: 'your_secure_password'
      FTLCONF_LOCAL_IPV4: '127.0.0.1'
    volumes:
      - pihole_config:/etc/pihole
      - dnsmasq_config:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN

  # --- MONITORING & DASHBOARD ---
  uptime-kuma:
    <<: *common-keys
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptimekuma_data:/app/data

  homepage:
    <<: *common-keys
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- MEDIA & CONTENT ---
  jellyfin:
    <<: *common-keys
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${HOME}/Media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=${SERVER_URL:-http://localhost:8096}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  portfolio_web:
    <<: *common-keys
    build: ./portfolio
    container_name: portfolio_web
    ports:
      - "3002:3000"

  # --- AUTOMATION ---
  n8n:
    <<: *common-keys
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${SERVER_URL:-localhost}
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  portainer_data:
  pihole_config:
  dnsmasq_config:
  uptimekuma_data:
  jellyfin_config:
  jellyfin_cache:
  n8n_data:
